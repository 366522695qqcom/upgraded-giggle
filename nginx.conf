# Map URI to ports
map $uri $port {
    ~^/w0/    3001;
    ~^/w1/    3002;
    ~^/w2/    3003;
    ~^/w3/    3004;
    ~^/w4/    3005;
    ~^/w5/    3006;
    ~^/w6/    3007;
    ~^/w7/    3008;
    ~^/w8/    3009;
    ~^/w9/    3010;
    ~^/w10/   3011;
    ~^/w11/   3012;
    ~^/w12/   3013;
    ~^/w13/   3014;
    ~^/w14/   3015;
    ~^/w15/   3016;
    ~^/w16/   3017;
    ~^/w17/   3018;
    ~^/w18/   3019;
    ~^/w19/   3020;
    ~^/w20/   3021;
    ~^/w21/   3022;
    ~^/w22/   3023;
    ~^/w23/   3024;
    ~^/w24/   3025;
    ~^/w25/   3026;
    ~^/w26/   3027;
    ~^/w27/   3028;
    ~^/w28/   3029;
    ~^/w29/   3030;
    ~^/w30/   3031;
    ~^/w31/   3032;
    ~^/w32/   3033;
    ~^/w33/   3034;
    ~^/w34/   3035;
    ~^/w35/   3036;
    ~^/w36/   3037;
    ~^/w37/   3038;
    ~^/w38/   3039;
    ~^/w39/   3040;
    ~^/w40/   3041;
    default   3000;
}

# WebSocket settings
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# WebSocket path handling
map $uri $uri_path {
    ~^/w\d+(/.*)?$    $1;
    default           $uri;
}

# Cache configuration
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=24h max_size=1g;
# API cache for frequently requested endpoints
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=API_CACHE:10m inactive=60m max_size=100m;

server {
    listen 80 default_server;
    
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # Static file handling with proper MIME types and consistent caching
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        
        # Include MIME types
        include /etc/nginx/mime.types;
        
        # Cache configuration for static files
        proxy_cache STATIC;
        proxy_cache_valid 200 302 24h;  # Cache successful responses for 24 hours
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        
        # Show cache status in response headers
        add_header X-Cache-Status $upstream_cache_status;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Default cache policy for static files
        add_header Cache-Control "public, max-age=86400";  # 24 hours
    }
    
    # Master process API routes (port 3000)
    location = /api/public_lobbies {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # Cache configuration
        proxy_cache API_CACHE;
        proxy_cache_valid 200 1s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location = /api/env {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # Cache configuration
        proxy_cache API_CACHE;
        proxy_cache_valid 200 1h;  # Cache successful responses for 1 hour
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    
    
    # Worker API routes - route to appropriate worker port based on game ID
    location ~ ^/api/(create_game|start_game|game|kick_player|join_game|spectate|leave_game|get_actions|set_ready|set_turn_duration|set_map_seed|set_game_config|set_player_name|update_cosmetics|set_nation_color|set_flag|set_badge)/ {
        # Extract game ID from path: /api/create_game/:id or /api/game/:id
        if ($request_uri ~* "^/api/(create_game|game|kick_player|join_game|spectate|leave_game|get_actions|set_ready|set_turn_duration|set_map_seed|set_game_config|set_player_name|update_cosmetics|set_nation_color|set_flag|set_badge)/([^/]+)") {
            set $game_id $2;
        }
        if ($request_uri ~* "^/api/start_game/([^/]+)") {
            set $game_id $1;
        }
        
        # Calculate worker index from game ID (hash-based distribution for 2 workers)
        set $worker_index 0;
        set $last_digit 0;
        
        # Extract last digit from game_id for worker selection
        if ($game_id ~* "([0-9])$") {
            set $last_digit $1;
        }
        
        # Set worker index based on last digit (0-1 range for 2 workers)
        set $worker_index 0;
        if ($last_digit ~ "[13579]") {
            set $worker_index 1;
        }
        
        # Calculate target port (3001 + worker_index, supporting workers 0-1)
        set $target_port 3001;
        if ($worker_index = 1) { set $target_port 3002; }
        
        proxy_pass http://127.0.0.1:$target_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # /commit.txt endpoint - Cache for 5 seconds
    location = /commit.txt {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # Cache configuration
        proxy_cache API_CACHE;
        proxy_cache_valid 200 5s;  # Cache successful responses for 5 seconds
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Binary files caching
    location ~* \.(bin|dat|exe|dll|so|dylib)$ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";  # 1 year for binary files
        
        proxy_cache STATIC;
        proxy_cache_valid 200 302 24h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Specific file type caching rules (outside the /static/ location)
    location ~* \.js$ {
        proxy_pass http://127.0.0.1:3000;
        add_header Content-Type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";  # 1 year for JS files
        
        proxy_cache STATIC;
        proxy_cache_valid 200 302 24h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location ~* \.css$ {
        proxy_pass http://127.0.0.1:3000;
        add_header Content-Type text/css;
        add_header Cache-Control "public, max-age=31536000, immutable";  # 1 year for CSS files
        
        proxy_cache STATIC;
        proxy_cache_valid 200 302 24h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Updated HTML file caching - 1 second cache
    location ~* \.html$ {
        proxy_pass http://127.0.0.1:3000;
        add_header Content-Type text/html;
        add_header Cache-Control "public, max-age=1";  # 1 second for HTML files
        
        proxy_cache STATIC;
        proxy_cache_valid 200 302 1s;  # Cache successful responses for 1 second
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Root location with short Nginx cache but no browser cache
    location = / {
        proxy_pass http://127.0.0.1:3000;
        
        # Tell browsers not to cache
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        
        # But let Nginx cache for 1 second to reduce load
        proxy_cache STATIC;
        proxy_cache_valid 200 302 1s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        
        # Show cache status in response headers
        add_header X-Cache-Status $upstream_cache_status;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    
    
    # Default location for all other requests
    location / {
        # First check if it's an API endpoint that should go to workers
        if ($request_uri ~* "^/api/") {
            # For any other API endpoint, route to worker 0 as default
            proxy_pass http://127.0.0.1:3001;
        } 
        # Otherwise route to master
        if ($request_uri !~* "^/api/") {
            proxy_pass http://127.0.0.1:3000;
        }
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    
    
    # Worker locations (supports workers 0-1)
    location ~* ^/w([01])(/.*)?$ {
        set $worker $1;
        set $worker_port 3001;
        
        if ($worker = "0") { set $worker_port 3001; }
        if ($worker = "1") { set $worker_port 3002; }
        
        proxy_pass http://127.0.0.1:$worker_port$2;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Explicitly block workers 2 and above
    location ~* ^/w([2-9]|[1-9]d+)(/.*)?$ {
        return 403;
    }
}